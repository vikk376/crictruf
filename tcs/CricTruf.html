<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>CricTruf</title>
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{--y:#FFD400;--y2:#FFE45C;--y3:#FFF3A3;--k:#0A0A0A;--w:#fff;
  --bg:#FAFAF2;--card:#fff;--ink:#0A0A0A;--mut:#6b6b5e;--line:#0A0A0A;--soft:#F3F0DC;--hdr:#0A0A0A;--hdrink:#FFD400;--btn:#FFD400;--btnink:#0A0A0A;--danger:#d62828;--ok:#1a8f3c;
  --safe-t:env(safe-area-inset-top,0px);--safe-b:env(safe-area-inset-bottom,0px)}
[data-theme=dark]{--bg:#0A0A0A;--card:#161616;--ink:#fff;--mut:#a8a690;--line:#FFD400;--soft:#222;--hdr:#000;--hdrink:#FFD400;--btn:#FFD400;--btnink:#0A0A0A}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.35 system-ui,-apple-system,Segoe UI,Roboto,sans-serif;overscroll-behavior:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:2px solid var(--line);background:var(--card);border-radius:12px;padding:10px 14px;font-weight:700;touch-action:manipulation}
button:active{transform:scale(.96)}
button:disabled{opacity:.4}
input,select,textarea{width:100%;border:2px solid var(--line);background:var(--card);border-radius:10px;padding:10px 12px;margin:4px 0 10px}
input[type=checkbox],input[type=radio]{width:auto;margin:0 8px 0 0;transform:scale(1.3)}
label{font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mut)}
h2{margin:18px 0 8px;font-size:18px} h3{margin:12px 0 6px;font-size:15px}
#app{max-width:520px;margin:0 auto;min-height:100vh;padding-bottom:calc(76px + var(--safe-b))}
.top{position:sticky;top:0;z-index:20;background:var(--hdr);color:var(--hdrink);display:flex;align-items:center;gap:8px;padding:calc(10px + var(--safe-t)) 12px 10px;border-bottom:4px solid var(--y)}
.top h1{flex:1;margin:0;font-size:18px;letter-spacing:.02em;text-transform:uppercase}
.top button{background:transparent;color:var(--hdrink);border:2px solid var(--hdrink);padding:6px 11px;border-radius:10px}
.brand{display:flex;align-items:center;gap:8px}.logo{width:30px;height:30px;border-radius:50%;background:var(--y);display:inline-block;position:relative;border:2px solid #fff}
.logo:before{content:"";position:absolute;inset:3px;border-radius:50%;border:2px solid #fff;border-left-color:transparent;border-right-color:transparent;transform:rotate(30deg)}
.page{padding:12px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:12px;margin:0 0 12px}
.card.y{background:var(--y);color:#000;border-color:#000}
.card.k{background:#000;color:var(--y);border-color:var(--y)}
.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.wrap{flex-wrap:wrap}.sp{justify-content:space-between}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.mut{color:var(--mut);font-size:13px}.c{text-align:center}.b{font-weight:800}.r{text-align:right}
.btn{background:var(--btn);color:var(--btnink);border-color:#000;width:100%;padding:13px;font-size:16px;text-transform:uppercase;letter-spacing:.03em}
.btn.k{background:#000;color:var(--y);border-color:var(--y)}
.btn.sm{width:auto;padding:7px 12px;font-size:13px}.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.danger{background:var(--danger);color:#fff;border-color:#000}
.chip{border-radius:99px;padding:7px 13px;font-size:13px;background:var(--card);border:2px solid var(--line);display:inline-block;margin:0 6px 6px 0}
.chip.on{background:var(--y);color:#000;border-color:#000}
.nav{position:fixed;bottom:0;left:0;right:0;max-width:520px;margin:0 auto;background:var(--hdr);display:flex;border-top:4px solid var(--y);padding-bottom:var(--safe-b);z-index:30}
.nav button{flex:1;background:transparent;border:0;border-radius:0;color:#bbb;padding:9px 2px;font-size:11px;text-transform:uppercase;font-weight:800}
.nav button.on{color:var(--y)}.nav button i{display:block;font-style:normal;font-size:20px}
.list>.item{display:flex;align-items:center;gap:10px;padding:11px 4px;border-bottom:1px solid var(--soft)}
.item .grow{flex:1;min-width:0}.avatar{width:40px;height:40px;border-radius:50%;background:var(--y);color:#000;font-weight:900;display:flex;align-items:center;justify-content:center;border:2px solid #000;overflow:hidden;flex:none}
.avatar img{width:100%;height:100%;object-fit:cover}
.tag{display:inline-block;background:var(--y);color:#000;border-radius:6px;padding:1px 7px;font-size:11px;font-weight:900;text-transform:uppercase}
.tag.k{background:#000;color:var(--y)}.tag.red{background:var(--danger);color:#fff}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 4px;text-align:right;border-bottom:1px solid var(--soft)}th:first-child,td:first-child{text-align:left}
th{font-size:11px;text-transform:uppercase;color:var(--mut)}
/* scoring */
.score-head{background:#000;color:var(--y);border-radius:18px;padding:14px;margin:0 0 10px;border:3px solid var(--y)}
.score-head .tm{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:#fff}
.score-head .big{font-size:50px;font-weight:900;line-height:1}.score-head .big small{font-size:20px;color:#fff;font-weight:700}
.score-head .sub{color:#fff;font-size:13px;margin-top:4px}
.fh{background:var(--danger);color:#fff;border-radius:8px;padding:2px 8px;font-size:11px;font-weight:900;animation:blink .8s infinite alternate}
@keyframes blink{to{opacity:.45}}
.balls{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.ball{min-width:34px;height:34px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font-weight:900;font-size:13px;background:#fff;color:#000;border:2px solid #000;padding:0 4px}
.ball.f{background:var(--y)}.ball.s{background:#000;color:var(--y);border-color:var(--y)}.ball.w{background:var(--danger);color:#fff}.ball.x{background:var(--soft)}
.pad{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}
.pbtn{height:64px;font-size:28px;background:var(--card)}.pbtn.r4{background:var(--y);color:#000}.pbtn.r6{background:#000;color:var(--y);border-color:var(--y)}
.pbtn.dot{background:var(--soft)}
.mods{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}.mods .chip{margin:0;text-align:center;padding:10px 2px;border-radius:12px}
.act{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0}.act .wk{background:var(--danger);color:#fff;border-color:#000}
.seg{display:flex;border:2px solid var(--line);border-radius:12px;overflow:hidden;margin:8px 0}.seg button{flex:1;border:0;border-radius:0;background:transparent}.seg button.on{background:var(--y);color:#000}
.modal{position:fixed;inset:0;z-index:60;background:rgba(0,0,0,.65);display:flex;align-items:flex-end;justify-content:center}
.modal>.sheet{background:var(--bg);border-top:5px solid var(--y);border-radius:20px 20px 0 0;width:100%;max-width:520px;max-height:88vh;overflow:auto;padding:14px 14px calc(18px + var(--safe-b))}
.sheet h2{margin-top:0}.close{float:right;width:auto;padding:4px 12px}
/* ground: dark green turf */
svg.ground{width:100%;height:auto;display:block;touch-action:manipulation}
.ground .zn{stroke:rgba(255,255,255,.4);stroke-width:1.6;cursor:pointer;transition:filter .1s}
.ground.heat .zn{stroke:#000;stroke-width:1.4}
.ground .r0{fill:#2a7d43}.ground .r1{fill:#1f6a36}.ground .r2{fill:#175a2c}.ground .r3{fill:#0e4420}.ground .r4{fill:#05210e}
.ground .zt{font-weight:900;font-size:30px;text-anchor:middle;dominant-baseline:central;pointer-events:none;fill:#fff}
.ground .zt.r2{fill:#FFE45C}.ground .zt.r3{fill:var(--y)}.ground .zt.r4{fill:#fff}.ground .zt.zb{fill:#111}
.ground .zn.sel{stroke:var(--y);stroke-width:7;filter:drop-shadow(0 0 8px var(--y));animation:pulse .7s infinite alternate}
.ground .zn.selk{stroke:#000;stroke-width:6}
@keyframes pulse{to{opacity:.75}}
.ground .pitch{fill:#F2E6B1;stroke:#000;stroke-width:3}
.ground .pitch,.ground line,.ground .box,.ground .nm,.ground .zn-name{pointer-events:none}
.ground .box{fill:none;stroke:#031a0b;stroke-width:5}.ground .stump{stroke:#000;stroke-width:6}
.ground .zb2{fill:#dfe6df}.ground .zn.off{opacity:.3}
.ground .nm{font-size:17px;font-weight:800;text-anchor:middle;dominant-baseline:central;fill:#fff;paint-order:stroke;stroke:#05210e;stroke-width:4px;stroke-linejoin:round}
.ground .zn-name{font-size:16px;font-weight:800;text-anchor:middle;fill:#3b5a43;letter-spacing:.5px}
.ground:not(.heat) .zn-name:not([x="378.5"]){fill:#4a6150}
.ground .zn-name[x="378.5"]{fill:#d7f0dd}
.ground .lbl{font-size:20px;font-weight:800;fill:var(--mut);text-anchor:middle}
.zinfo{background:var(--y);color:#000;border:3px solid #000;border-radius:14px;padding:8px 10px;margin:8px 0;position:sticky;bottom:calc(8px + var(--safe-b));z-index:15;box-shadow:0 8px 28px rgba(0,0,0,.45)}
.zinfo .row button{padding:8px 4px}
.zinfo .z{font-size:18px;font-weight:900}.zinfo button{background:#fff;color:#000;border-color:#000}
.empty{padding:36px 16px;text-align:center;color:var(--mut)}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#000;color:var(--y);padding:10px 18px;border-radius:99px;font-weight:800;z-index:90;border:2px solid var(--y);animation:tin .2s}
@keyframes tin{from{opacity:0;transform:translate(-50%,10px)}}
.coin{width:110px;height:110px;border-radius:50%;margin:10px auto;background:radial-gradient(circle at 35% 30%,#fff3a3,#FFD400 55%,#b89700);border:4px solid #000;display:flex;align-items:center;justify-content:center;font-size:34px;font-weight:900;color:#000}
.coin.flip{animation:flip 1s ease-in-out}@keyframes flip{to{transform:rotateY(1440deg)}}
.bar{height:16px;background:var(--y);border:2px solid #000;border-radius:5px}.bars{display:flex;align-items:flex-end;gap:5px;height:120px;margin:8px 0}
.bars>div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;font-size:10px;font-weight:800;height:100%}
.bars .col{width:100%;background:var(--y);border:2px solid #000;border-radius:5px 5px 0 0;min-height:2px}.bars .col.wk{background:var(--danger)}
.kpi{background:var(--card);border:2px solid var(--line);border-radius:14px;padding:10px;text-align:center}.kpi b{display:block;font-size:24px}.kpi span{font-size:11px;text-transform:uppercase;color:var(--mut);font-weight:800}
/* celebration (4 and 6) */
.cele{position:fixed;inset:0;z-index:100;pointer-events:none;display:flex;align-items:center;justify-content:center;overflow:hidden;animation:cele 1.9s ease-out forwards}
@keyframes cele{0%{opacity:0}8%{opacity:1}75%{opacity:1}100%{opacity:0}}
.cele .txt{font-size:25vw;max-font-size:140px;font-weight:1000;font-family:Impact,system-ui,sans-serif;letter-spacing:.04em;animation:pop .6s cubic-bezier(.2,1.6,.4,1) both;text-shadow:0 6px 0 rgba(0,0,0,.35);z-index:3}
@keyframes pop{from{transform:scale(.2) rotate(-12deg)}}
.cele.c4{background:radial-gradient(circle at 50% 50%,#fff 0%,#FFE45C 22%,#FFD400 45%,#000 100%)}
.cele.c4 .txt{color:#000;-webkit-text-stroke:3px #fff}
.cele.c4 .ring{position:absolute;border:8px solid #000;border-radius:50%;width:30vmin;height:30vmin;animation:ring 1.3s ease-out infinite;opacity:0}
.cele.c4 .ring:nth-child(2){animation-delay:.25s;border-color:#fff}.cele.c4 .ring:nth-child(3){animation-delay:.5s}
@keyframes ring{0%{transform:scale(.3);opacity:.9}100%{transform:scale(5);opacity:0}}
.cele.c6{background:#000}
.cele.c6:before{content:"";position:absolute;width:260vmax;height:260vmax;background:repeating-conic-gradient(from 0deg,#FFD400 0 10deg,#000 10deg 20deg);animation:spin 3s linear infinite;opacity:.9;mask-image:radial-gradient(circle,#000 0,transparent 60%);-webkit-mask-image:radial-gradient(circle,#000 0,transparent 60%)}
@keyframes spin{to{transform:rotate(360deg)}}
.cele.c6 .txt{color:#FFD400;-webkit-text-stroke:3px #000;text-shadow:0 0 30px #fff,0 6px 0 #000}
.cele .cf{position:absolute;top:-20px;width:10px;height:16px;animation:fall 1.8s linear forwards;z-index:2}
@keyframes fall{to{transform:translateY(115vh) rotate(720deg)}}
.hide{display:none!important}
.login{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:24px;background:#000;color:var(--y)}
.login h1{font-size:34px;margin:12px 0;line-height:1.05;text-transform:uppercase}.login input,.login select{background:#fff;color:#000;border-color:var(--y)}
.login label{color:#fff}
.hero{background:var(--y);color:#000;border:3px solid #000;border-radius:20px;padding:16px;margin-bottom:12px}
.stepper{display:flex;gap:4px;margin-bottom:12px}.stepper i{flex:1;height:6px;border-radius:3px;background:var(--soft)}.stepper i.on{background:var(--y);outline:1px solid #000}
.sw{display:flex;align-items:center;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--soft);gap:10px}
.sw input{width:auto;margin:0;transform:scale(1.4)}
details{margin:6px 0}summary{font-weight:800;cursor:pointer;padding:8px 0}
.boardwrap{background:#000;color:#fff;min-height:100vh;padding:14px}.boardwrap .teams{display:flex;justify-content:space-between;align-items:center}
.boardwrap .sc{font-size:72px;font-weight:1000;color:var(--y);line-height:1;text-align:center;margin:10px 0}
.boardwrap .av{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:24px;border:3px solid var(--y);color:#000}
</style>
</head>
<body>
<div id="app"></div>
<script>/* CricTruf: pure scoring engine (no DOM). State is derived by replaying
   the ball-by-ball event log, so undo/correction/strike-rotation are always consistent. */
(function (g) {
  'use strict';
  const uid = () => Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-4);

  const RINGS = ['Zone 1 (near)', 'Middle', 'Outer', 'Boundary (4)', 'Over the net (6)', 'Back wall', 'Zone 2'];
  // Front-field shot sectors, left to right across the ground (off side on the left for a right-hand batter)
  const SHOTS = ['Reverse sweep', 'Late cut', 'Cut', 'Cover', 'Mid off', 'Straight drive', 'Straight lofted', 'Mid on', 'Flick', 'Sweep', 'Paddle sweep'];
  const SECTORS = SHOTS.length;

  const DISMISSALS = [
    { k: 'bowled', label: 'Bowled', bowler: true },
    { k: 'caught', label: 'Caught (direct)', bowler: true },
    { k: 'oneTipOneHand', label: 'One-tip-one-hand', bowler: true },
    { k: 'lbw', label: 'LBW', bowler: true },
    { k: 'stumped', label: 'Stumped', bowler: true },
    { k: 'hitWicket', label: 'Hit wicket', bowler: true },
    { k: 'runOut', label: 'Run out', bowler: false },
  ];

  const DEFAULT_RULES = {
    ballsPerOver: 6,
    wideRuns: 1, noBallRuns: 1,
    wideReball: true, noBallReball: true,
    freeHit: true,
    overEndSwap: true,
    lastManBatting: false,
    maxOversPerBowler: 0,
    superOver: true, superOverWickets: 2, superOverOvers: 1,
    autoCommitZone: false,
    dismissals: { bowled: true, caught: true, oneTipOneHand: true, lbw: false, stumped: true, hitWicket: true, runOut: true },
    special: [
      { id: 'sw', name: 'Side wall', runs: 2, rotate: 'keep', out: false },
      { id: 'nt', name: 'Net touch', runs: 1, rotate: 'change', out: false },
      { id: 'rf', name: 'Roof / out of ground', runs: 6, rotate: 'keep', out: false },
    ],
    notes: '',
  };

  // Zone 1 = the near ring around the pitch (all 11 shot sectors), Zone 2 = the grey wedges beside the pitch.
  // Only these two are DIC zones: default 1 run and the same striker (strike changes only when the over completes).
  // The rest of the ground is fixed: middle 2, outer 3 (strike changes), boundary 4, over the net 6.
  // 4 and 6 exist only in the front-field shot sectors.
  function buildDefaultZones() {
    const z = [{ id: 'z2', ring: 6, sec: 0, label: 'Zone 2', runs: 1, rotate: 'keep', off: false }];
    const cfg = [[1, 'keep'], [2, 'keep'], [3, 'change'], [4, 'keep'], [6, 'keep']];
    for (let r = 0; r < 5; r++) for (let s = 0; s < SECTORS; s++)
      z.push({ id: 'f' + r + 's' + s, ring: r, sec: s, label: SHOTS[s], runs: cfg[r][0], rotate: cfg[r][1], off: false });
    return z;
  }
  // Old presets (back-wall Zone 1 strip) are rebuilt in the new layout, keeping shot names and Zone 2 settings.
  function upgradeZones(d) {
    if (!d || !d.zones || !d.zones.some(z => z.id === 'z1')) return d;
    const nz = buildDefaultZones(), z2 = d.zones.find(z => z.id === 'z2');
    nz.forEach(z => { if (z.id === 'z2' && z2) { z.runs = z2.runs; z.rotate = z2.rotate; z.off = !!z2.off; } else if (z.ring < 5) { const o = d.zones.find(x => x.ring < 5 && x.sec === z.sec); if (o) z.label = o.label; } });
    d.zones = nz; return d;
  }
  function defaultDic(name) { return { id: uid(), name: name || 'Default Turf', turf: '', zones: buildDefaultZones() }; }
  const clone = o => JSON.parse(JSON.stringify(o));
  const rulesOf = m => Object.assign({}, DEFAULT_RULES, m && m.rules);

  function oversStr(legal, bpo) { bpo = bpo || 6; return Math.floor(legal / bpo) + '.' + (legal % bpo); }

  /* ---------- Match / innings creation ---------- */
  function createMatch(cfg) {
    return {
      id: uid(), name: cfg.name || 'Match', date: cfg.date, venue: cfg.venue || '', turf: cfg.turf || '',
      overs: +cfg.overs || 10, teams: cfg.teams, toss: null, battingFirst: null,
      rules: clone(Object.assign({}, DEFAULT_RULES, cfg.rules || {})),
      dic: clone(cfg.dic || defaultDic()), innings: [], audit: [], created: Date.now(),
      tournamentId: cfg.tournamentId || null, fixtureId: cfg.fixtureId || null, status: 'toss',
    };
  }
  function newInnings(match, batIdx, opts) {
    opts = opts || {};
    const R = rulesOf(match);
    const bat = match.teams[batIdx], n = bat.xi.length;
    const sup = opts.type === 'super';
    const prev = opts.chaseOf != null ? replay(match, match.innings[opts.chaseOf]) : null;
    const inn = {
      id: uid(), batting: batIdx, bowling: 1 - batIdx, type: sup ? 'super' : 'normal',
      overs: sup ? R.superOverOvers : match.overs,
      maxWkts: sup ? Math.min(R.superOverWickets, R.lastManBatting ? n : n - 1) : (R.lastManBatting ? n : Math.max(1, n - 1)),
      squad: bat.xi.slice(), target: prev ? prev.runs + 1 : null, events: [],
    };
    match.innings.push(inn);
    return inn;
  }

  /* ---------- Replay ---------- */
  function ballLabel(e) {
    let s = '';
    if (e.extra === 'wd') s = 'Wd' + (e.runs ? '+' + e.runs : '');
    else if (e.extra === 'nb') s = 'Nb' + (e.runs ? '+' + e.runs : '');
    else if (e.extra === 'b') s = e.runs + 'B';
    else if (e.extra === 'lb') s = e.runs + 'LB';
    else s = e.runs === 0 ? '•' : String(e.runs);
    if (e.wicket) s = (e.extra || e.runs ? s + ' ' : '') + 'W';
    return s;
  }

  function replay(match, inn) {
    const R = rulesOf(match), bpo = R.ballsPerOver;
    const st = {
      runs: 0, wkts: 0, legal: 0, extras: { wd: 0, nb: 0, b: 0, lb: 0 },
      striker: null, nonStriker: null, bowler: null, lastBowler: null,
      batters: {}, order: [], bowlers: {}, bowlerOrder: [], fow: [], part: { runs: 0, balls: 0 },
      overs: [], timeline: [], freeHit: false, ended: false, endReason: '', opened: false,
      target: inn.target || null, bpo, inn,
    };
    const touch = id => {
      if (id == null) return;
      if (!st.batters[id]) { st.batters[id] = { id, runs: 0, balls: 0, fours: 0, sixes: 0, dots: 0, out: false, how: '', retired: false }; st.order.push(id); }
    };
    const bw = id => {
      if (!st.bowlers[id]) { st.bowlers[id] = { id, balls: 0, runs: 0, wkts: 0, maidens: 0, wd: 0, nb: 0, dots: 0, curBalls: 0, curRuns: 0 }; st.bowlerOrder.push(id); }
      return st.bowlers[id];
    };
    const avail = () => inn.squad.filter(id => !st.batters[id]).length;
    const swap = () => { if ((st.striker != null && st.nonStriker != null) || avail() > 0) { const t = st.striker; st.striker = st.nonStriker; st.nonStriker = t; } };
    const overRec = i => { while (st.overs.length <= i) st.overs.push({ runs: 0, wkts: 0, balls: 0 }); return st.overs[i]; };

    for (const e of inn.events) {
      if (st.ended) break;
      if (e.t === 'open') { st.striker = e.striker; st.nonStriker = e.nonStriker; touch(e.striker); touch(e.nonStriker); st.opened = true; }
      else if (e.t === 'bowler') { st.bowler = e.id; bw(e.id); }
      else if (e.t === 'batter') { touch(e.id); if (st.striker == null) st.striker = e.id; else if (st.nonStriker == null) st.nonStriker = e.id; }
      else if (e.t === 'retire') {

    if (c.inn) { c.inn.events.push({ t: 'end' }); }
    const m = c.m, ev = CE.evaluate(m);
    if (ev.status === 'completed') { A.save(); return A.render(); }
    let o = {};
    if (ev.next === 'startSecond') o = { chaseOf: ev.pairFirst, type: m.innings[ev.pairFirst].type };
    else if (ev.next === 'superOver') o = { type: 'super' };
    else if (!ev.next) { A.save(); return A.render(); }
    CE.newInnings(m, ev.nextBat, o); A.save(); A.render();
  };
  A.actions.undoPrev = () => {
    const m = A.getMatch(); const inn = m && m.innings[m.innings.length - 1]; if (!inn) return;
    if (CE.undo(m, inn)) { m.status = 'live'; A.save(); A.toast('Last ball undone'); A.render(); }
  };
  A.actions.leaveLive = () => { ui.modal = null; ui.view = 'home'; ui.stack = []; A.render(); };

  /* ---------- modals ---------- */
  const forced = (title, body) => '<div class="modal"><div class="sheet"><h2>' + esc(title) + '</h2>' + body + '<button class="btn ghost" data-a="leaveLive" style="margin-top:10px">Leave scoring (saved)</button></div></div>';

  A.modals.openers = function () {
    const { m, inn } = A.ctx();
    const bat = m.teams[inn.batting], bowl = m.teams[inn.bowling];
    const opt = (t, ids, sel) => ids.map((id, i) => '<option value="' + id + '"' + (i === sel ? ' selected' : '') + '>' + esc(pname(m, id)) + '</option>').join('');
    return forced('Opening pair & first bowler',
      '<label>Striker (' + esc(bat.name) + ')</label><select id="op_s">' + opt(bat, inn.squad, 0) + '</select>' +
      '<label>Non-striker</label><select id="op_n">' + opt(bat, inn.squad, 1) + '</select>' +
      '<label>Opening bowler (' + esc(bowl.name) + ')</label><select id="op_b">' + opt(bowl, bowl.xi, 0) + '</select>' +
      '<button class="btn" data-a="openersOk">Start scoring</button>');
  };
  A.actions.openersOk = () => {
    const c = A.ctx(); const s = document.getElementById('op_s').value, n = document.getElementById('op_n').value, b = document.getElementById('op_b').value;
    if (s === n) return A.toast('Pick two different batters');
    c.inn.events.push({ t: 'open', striker: s, nonStriker: n }, { t: 'bowler', id: b });
    ui.modal = null; A.save(); A.render();
  };
  A.modals.batter = function () {
    const { m, inn, st } = A.ctx();
    return forced('New batter', st.availBatters.map(id => '<button class="btn ghost" style="margin-bottom:8px" data-a="pickBatter" data-id="' + id + '">' + esc(pname(m, id)) + '</button>').join(''));
  };
  A.actions.pickBatter = el => { const c = A.ctx(); c.inn.events.push({ t: 'batter', id: el.dataset.id }); ui.modal = null; A.save(); A.render(); };
  A.modals.bowler = function () {
    const { m, inn, st } = A.ctx(), bowl = m.teams[inn.bowling], R = CE.rulesOf(m);
    return forced('Select bowler for next over', bowl.xi.map(id => {
      const ok = CE.bowlerAllowed(m, st, id), b = st.bowlers[id];
      return '<button class="btn ghost" style="margin-bottom:8px;text-align:left"' + (ok ? '' : ' disabled') + ' data-a="pickBowler" data-id="' + id + '">' + esc(pname(m, id)) + ' <span class="mut">' + (b ? CE.oversStr(b.balls, R.ballsPerOver) + ' ov · ' + b.runs + 'r · ' + b.wkts + 'w' : 'new') + (id === st.lastBowler ? ' · bowled last over' : !ok ? ' · quota done' : '') + '</span></button>';
    }).join(''));
  };
  A.actions.pickBowler = el => { const c = A.ctx(); c.inn.events.push({ t: 'bowler', id: el.dataset.id }); ui.modal = null; A.save(); A.render(); };

  A.actions.wicket = () => {
    const c = A.ctx(); const R = CE.rulesOf(c.m);
    const kinds = CE.DISMISSALS.filter(d => R.dismissals[d.k] !== false && (!c.st.freeHit || d.k === 'runOut'));
    ui.modal = { type: 'wicket', kind: kinds[0] ? kinds[0].k : 'runOut', out: 's', runs: 0, fielder: '' };
    A.render();
  };
  A.modals.wicket = function (mo) {
    const { m, st } = A.ctx(), R = CE.rulesOf(m);
    const kinds = CE.DISMISSALS.filter(d => R.dismissals[d.k] !== false && (!st.freeHit || d.k === 'runOut'));
    let h = st.freeHit ? '<div class="fh" style="display:inline-block;margin-bottom:8px">FREE HIT: only run out</div>' : '';
    h += '<label>How out</label><div>' + kinds.map(k => '<button class="chip ' + (mo.kind === k.k ? 'on' : '') + '" data-a="wk" data-f="kind" data-v="' + k.k + '">' + esc(k.label) + '</button>').join('') + '</div>';
    if (mo.kind === 'runOut') {
      h += '<label>Who is out</label><div><button class="chip ' + (mo.out === 's' ? 'on' : '') + '" data-a="wk" data-f="out" data-v="s">' + esc(pname(m, st.striker)) + ' (striker)</button>' +
        (st.nonStriker != null ? '<button class="chip ' + (mo.out === 'n' ? 'on' : '') + '" data-a="wk" data-f="out" data-v="n">' + esc(pname(m, st.nonStriker)) + '</button>' : '') + '</div>';
      h += '<label>Runs completed on this ball</label><div>' + [0, 1, 2, 3].map(r => '<button class="chip ' + (mo.runs === r ? 'on' : '') + '" data-a="wk" data-f="runs" data-v="' + r + '">' + r + '</button>').join('') + '</div>';
    }
    h += '<label>Fielder (optional)</label><input data-b="ui.modal.fielder" value="' + esc(mo.fielder) + '" placeholder="Name">';
    if (ui.mod) h += '<div class="mut">Applied with: ' + ({ wd: 'Wide', nb: 'No-ball', b: 'Bye', lb: 'Leg-bye' })[ui.mod] + '</div>';
    return A.sheet('Wicket', h + '<button class="btn danger" data-a="wkOk">Confirm wicket</button>');
  };
  A.actions.wk = el => { const f = el.dataset.f; ui.modal[f] = f === 'runs' ? +el.dataset.v : el.dataset.v; A.render(); };
  A.actions.wkOk = () => {
    const c = A.ctx(), mo = ui.modal, d = CE.DISMISSALS.find(d => d.k === mo.kind);
    const out = mo.kind === 'runOut' && mo.out === 'n' ? c.st.nonStriker : c.st.striker;
    const runs = mo.kind === 'runOut' ? mo.runs : 0;
    ui.modal = null;
    commitScore({ runs, wicket: { kind: mo.kind, out, bowlerCredit: !!d.bowler, fielder: mo.fielder } });
  };

  A.actions.menu = () => { ui.modal = { type: 'menu' }; A.render(); };
  A.modals.menu = function () {
    const c = A.ctx(), R = CE.rulesOf(c.m);
    return A.sheet('Match options',
      '<div class="grid2"><button class="btn ghost" data-a="retireOpen">Retire batter</button><button class="btn ghost" data-a="endInn">End innings</button>' +
      '<button class="btn ghost" data-a="open" data-v="scorecard" data-id="' + c.m.id + '">Scorecard</button><button class="btn ghost" data-a="open" data-v="analytics" data-id="' + c.m.id + '">Analytics</button>' +
      '<button class="btn ghost" data-a="rulesInfo">Match rules</button><button class="btn ghost" data-a="leaveLive">Leave</button></div>');
  };
  A.actions.rulesInfo = () => {
    const c = A.ctx(), R = CE.rulesOf(c.m);
    const rows = [['Balls per over', R.ballsPerOver], ['Wide', R.wideRuns + ' run' + (R.wideReball ? ' + re-bowl' : ' (counts as ball)')], ['No-ball', R.noBallRuns + ' run' + (R.noBallReball ? ' + re-bowl' : '') + (R.freeHit ? ' + free hit' : '')], ['Last man batting', R.lastManBatting ? 'Yes' : 'No'], ['Max overs / bowler', R.maxOversPerBowler || 'No limit'], ['Super over', R.superOver ? 'Yes' : 'No'], ['Dismissals', CE.DISMISSALS.filter(d => R.dismissals[d.k] !== false).map(d => d.label).join(', ')], ['DIC preset', c.m.dic.name + (c.m.turf ? ' (' + c.m.turf + ')' : '')]];
    ui.modal = { type: 'info', title: 'Match rules', html: '<table>' + rows.map(r => '<tr><td>' + esc(r[0]) + '</td><td class="r">' + esc(r[1]) + '</td></tr>').join('') + '</table>' + (R.notes ? '<p>' + esc(R.notes) + '</p>' : '') };
    A.render();
  };
  A.modals.info = mo => A.sheet(mo.title, mo.html);
  A.actions.endInn = () => { const c = A.ctx(); if (!c.inn) return; c.inn.events.push({ t: 'end' }); ui.modal = null; A.save(); A.render(); };

  A.actions.retireOpen = () => { ui.modal = { type: 'retire', who: 's' }; A.render(); };
  A.modals.retire = function (mo) {
    const { m, st } = A.ctx();
    return A.sheet('Retire batter',
      '<label>Who retires</label><div><button class="chip ' + (mo.who === 's' ? 'on' : '') + '" data-a="rt" data-f="who" data-v="s">' + esc(pname(m, st.striker)) + '</button>' +
      (st.nonStriker != null ? '<button class="chip ' + (mo.who === 'n' ? 'on' : '') + '" data-a="rt" data-f="who" data-v="n">' + esc(pname(m, st.nonStriker)) + '</button>' : '') + '</div>' +
      '<label>Replacement</label><select data-b="ui.modal.rep"><option value="">None</option>' + st.availBatters.map(id => '<option value="' + id + '">' + esc(pname(m, id)) + '</option>').join('') + '</select>' +
      '<button class="btn" data-a="rtOk">Confirm</button>');
  };
  A.actions.rt = el => { ui.modal[el.dataset.f] = el.dataset.v; A.render(); };
  A.actions.rtOk = () => {
    const c = A.ctx(), mo = ui.modal; const out = mo.who === 'n' ? c.st.nonStriker : c.st.striker;
    c.inn.events.push({ t: 'retire', out, in: mo.rep || null }); ui.modal = null; A.save(); A.render();
  };

  /* manual correction */
  A.actions.correct = () => { ui.modal = { type: 'correct', id: null }; A.render(); };
  A.modals.correct = function (mo) {
    const { m, inn, st } = A.ctx();
    const last = st.timeline.slice(-12);
    let h = '<div class="mut">Pick a delivery to correct (all changes are logged in the audit history).</div><div class="balls">' +
      last.map(b => '<button class="ball ' + (mo.id === b.id ? 'f' : '') + '" data-a="corPick" data-id="' + b.id + '">' + esc(b.label) + '</button>').join('') + '</div>';
    if (mo.id) {
      h += '<label>Runs (' + (mo.extra === 'wd' ? 'extra runs' : mo.extra === 'b' || mo.extra === 'lb' ? 'byes' : 'off the bat') + ')</label><div>' + [0, 1, 2, 3, 4, 5, 6].map(r => '<button class="chip ' + (mo.runs === r ? 'on' : '') + '" data-a="cor" data-f="runs" data-v="' + r + '">' + r + '</button>').join('') + '</div>' +
        '<label>Type</label><div>' + [['', 'Normal'], ['wd', 'Wide'], ['nb', 'No-ball'], ['b', 'Bye'], ['lb', 'Leg-bye']].map(x => '<button class="chip ' + ((mo.extra || '') === x[0] ? 'on' : '') + '" data-a="cor" data-f="extra" data-v="' + x[0] + '">' + x[1] + '</button>').join('') + '</div>' +
        '<label>Strike after ball</label><div><button class="chip ' + (!mo.rotate ? 'on' : '') + '" data-a="cor" data-f="rotate" data-v="0">Same striker</button><button class="chip ' + (mo.rotate ? 'on' : '') + '" data-a="cor" data-f="rotate" data-v="1">Change strike</button></div>' +
        (mo.hasW ? '<label>Wicket on this ball</label><div><button class="chip ' + (mo.keepW ? 'on' : '') + '" data-a="cor" data-f="keepW" data-v="1">Keep wicket</button><button class="chip ' + (!mo.keepW ? 'on' : '') + '" data-a="cor" data-f="keepW" data-v="0">Remove wicket</button></div>' : '') +
        '<button class="btn" data-a="corOk">Save correction</button>';
    }
    return A.sheet('Manual correction', h);
  };
  A.actions.corPick = el => {
    const c = A.ctx(); const e = c.inn.events.find(x => x.id === el.dataset.id);
    ui.modal = { type: 'correct', id: e.id, runs: e.runs, extra: e.extra, rotate: e.rotate, hasW: !!e.wicket, keepW: !!e.wicket }; A.render();
  };
  A.actions.cor = el => { const f = el.dataset.f, v = el.dataset.v; ui.modal[f] = f === 'runs' ? +v : f === 'extra' ? (v || null) : f === 'rotate' || f === 'keepW' ? v === '1' : v; A.render(); };
  A.actions.corOk = () => {
    const c = A.ctx(), mo = ui.modal;
    const patch = { runs: mo.runs, extra: mo.extra || null, rotate: mo.rotate };
    if (mo.hasW && !mo.keepW) patch.wicket = null;
    const before = JSON.stringify(c.inn.events);
    CE.correctBall(c.m, c.inn, mo.id, patch);
    const st = CE.replay(c.m, c.inn);
    ui.modal = null; A.save(); A.render(); A.toast('Correction saved');
  };
})();
</script>
<script>/* Login, home, new-match wizard, teams, players */
(function () {
  'use strict';
  const A = window.A, CE = A.CE, esc = A.esc, ui = A.ui, db = () => A.db;
  const COLORS = ['#FFD400', '#ffffff', '#111111', '#FF8A00', '#d62828', '#1a8f3c', '#1565c0', '#8e24aa'];

  A.actions.open = el => {
    const id = el.dataset.id, v = el.dataset.v;
    if (id) A.db.activeMatch = id;
    A.save(); A.go(v, { id });
  };
  A.actions.openMatch = el => {
    const m = A.matchById(el.dataset.id); A.db.activeMatch = m.id; A.save();
    A.go(m.status === 'completed' ? 'summary' : 'live', { id: m.id });
  };

  /* ---------- login ---------- */
  A.views.login = function () {
    if (A.db.user) { ui.view = 'home'; return A.views.home(); }
    return { html: '<div class="login"><div class="logo" style="width:64px;height:64px"></div><h1>Cric<br>Truf</h1><p style="color:#fff">Tennis-ball &amp; turf cricket scoring with DIC zone scoring. Works offline.</p>' +
      '<label>Your name</label><input id="lg_name" placeholder="e.g. Rahul" autocomplete="off">' +
      '<label>Role</label><select id="lg_role"><option value="admin">Admin / Organizer (full control)</option><option value="scorer">Scorer</option><option value="viewer">Viewer (read only)</option></select>' +
      '<button class="btn" data-a="login">Enter</button><p style="color:#bbb;font-size:12px;margin-top:14px">Accounts are stored on this device (offline-first). Role limits what this device can do.</p></div>' };
  };
  A.actions.login = () => {
    const name = document.getElementById('lg_name').value.trim() || 'Scorer';
    A.db.user = { name, role: document.getElementById('lg_role').value }; A.save(); ui.view = 'home'; A.render();
  };

  /* ---------- home ---------- */
  A.views.home = function () {
    const d = A.db, act = A.getMatch(), live = act && act.status !== 'completed' ? act : null;
    let h = '<div class="hero"><div class="tag k">Hi ' + esc(d.user ? d.user.name : '') + '</div><h2 style="margin:6px 0 10px;font-size:24px">Ready to score?</h2>' + (A.canScore() ? '<button class="btn k" data-a="newMatch">+ New match</button>' : '<div>Viewer mode</div>') + '</div>';
    if (live) {
      const ev = CE.evaluate(live), inn = ev.current >= 0 ? live.innings[ev.current] : null, st = inn ? CE.replay(live, inn) : null;
      h += '<div class="card k"><div class="row sp"><span class="tag">LIVE</span><span>' + esc(live.name) + '</span></div><div style="font-size:30px;font-weight:900;margin:6px 0">' + (st ? esc(live.teams[inn.batting].name) + ' ' + st.runs + '/' + st.wkts + ' <small>(' + st.oversText + ')</small>' : 'Between innings') + '</div><button class="btn" data-a="openMatch" data-id="' + live.id + '">Resume scoring</button></div>';
    }
    h += '<div class="grid2"><button class="card c" data-a="go" data-v="teams"><b>☻ Teams &amp; players</b></button><button class="card c" data-a="go" data-v="tournaments"><b>🏆 Tournaments</b></button><button class="card c" data-a="go" data-v="dic"><b>◎ DIC zones</b></button><button class="card c" data-a="go" data-v="stats"><b>▥ Analytics</b></button></div>';
    if (!d.teams.length) h += '<div class="card"><b>First time?</b><p class="mut">Add two sample teams to try the app in seconds, or create your own in Teams.</p><button class="btn sm" data-a="demo">Add demo teams</button></div>';
    const recent = d.matches.slice(0, 4);
    h += '<h2>Recent matches</h2>' + (recent.length ? recent.map(matchItem).join('') : '<div class="empty">No matches yet</div>');
    return A.page('CricTruf', h, 'home', { noBack: true });
  };
  A.actions.go = el => A.go(el.dataset.v, {});
  function matchItem(m) {
    const ev = CE.evaluate(m);
    return '<div class="card" data-a="openMatch" data-id="' + m.id + '"><div class="row sp"><b>' + esc(m.name) + '</b><span class="tag ' + (m.status === 'completed' ? 'k' : '') + '">' + (m.status === 'completed' ? 'Done' : m.status === 'toss' ? 'Setup' : 'Live') + '</span></div>' +
      '<div class="mut">' + esc(m.teams[0].name) + ' vs ' + esc(m.teams[1].name) + ' · ' + esc(m.date) + (m.venue ? ' · ' + esc(m.venue) : '') + '</div>' +
      (ev.text ? '<div class="b" style="margin-top:4px">' + esc(ev.text) + '</div>' : '') + '</div>';
  }
  A.matchItem = matchItem;

  A.actions.demo = () => {
    const mk = (name, color, names) => ({ id: CE.uid(), name, color, players: names.map((n, i) => ({ id: CE.uid(), name: n, role: i === 0 ? 'Wicketkeeper' : i < 4 ? 'Batsman' : i < 6 ? 'All-rounder' : 'Bowler', bat: 'Right', bowl: i > 3 ? 'Right-arm medium' : 'None' })) });
    A.db.teams.push(mk('Thunder XI', '#FFD400', ['Aarav', 'Rohan', 'Kabir', 'Vihaan', 'Arjun', 'Dev', 'Ishaan', 'Rudra', 'Yash']));
    A.db.teams.push(mk('Turf Kings', '#ffffff', ['Sameer', 'Farhan', 'Imran', 'Zaid', 'Nadeem', 'Ayaan', 'Rehan', 'Sufiyan', 'Tariq']));
    A.save(); A.toast('Demo teams added'); A.render();
  };

  /* ---------- match wizard ---------- */
  A.actions.newMatch = () => {
    ui.draft = { step: 1, name: '', date: A.today(), venue: '', turf: '', overs: 10, ppt: 8, a: '', b: '', dicId: A.db.dics[0].id, rules: CE.clone(A.db.rules), tournamentId: null, fixtureId: null, xi: {}, sub: {}, cap: {}, wk: {}, toss: {}, back: { z1: { on: true, runs: 1, change: false }, z2: { on: true, runs: 1, change: false } } };
    A.go('newmatch');
  };
  const stepBar = n => '<div class="stepper">' + [1, 2, 3, 4, 5].map(i => '<i class="' + (i <= n ? 'on' : '') + '"></i>').join('') + '</div>';
  const TITLES = ['', 'Match details', 'Select teams', 'Playing XI', 'Match rules', 'Toss'];

  A.views.newmatch = function () {
    const d = ui.draft; if (!d) { A.actions.newMatch(); return A.views.newmatch(); }
    let h = stepBar(d.step) + '<h2 style="margin-top:0">' + d.step + '. ' + TITLES[d.step] + '</h2>';
    if (d.step === 1) {
      h += '<label>Match name</label><input data-b="draft.name" value="' + esc(d.name) + '" placeholder="e.g. Sunday Final">' +
        '<div class="grid2"><div><label>Date</label><input type="date" data-b="draft.date" value="' + esc(d.date) + '"></div><div><label>Players / team</label><input type="number" min="2" max="15" data-n data-b="draft.ppt" value="' + d.ppt + '"></div></div>' +
        '<label>Venue</label><input data-b="draft.venue" value="' + esc(d.venue) + '" placeholder="City / area">' +
        '<label>Turf / ground name</label><input data-b="draft.turf" value="' + esc(d.turf) + '" list="turfs" placeholder="e.g. Green Box Turf"><datalist id="turfs">' + A.db.dics.filter(x => x.turf).map(x => '<option value="' + esc(x.turf) + '">').join('') + '</datalist>' +
        '<label>Overs</label><div>' + [5, 6, 8, 10, 12, 15, 20].map(o => '<button class="chip ' + (d.overs === o ? 'on' : '') + '" data-a="overs" data-v="' + o + '">' + o + '</button>').join('') + '</div>' +
        '<label>Custom overs</label><input type="number" min="1" max="50" data-n data-b="draft.overs" value="' + d.overs + '">' +
        '<label>DIC zone configuration</label><select data-b="draft.dicId">' + A.db.dics.map(x => '<option value="' + x.id + '"' + (x.id === d.dicId ? ' selected' : '') + '>' + esc(x.name + (x.turf ? ' · ' + x.turf : '')) + '</option>').join('') + '</select>' +
        '<div class="card"><h3 style="margin-top:0">Zone 1 and Zone 2 (DIC)</h3><div class="mut">Zone 1 = the near ring around the pitch. Zone 2 = the grey area beside the pitch. Decide how they score in this match. With "same striker" the strike stays put until the over completes. The rest of the ground scores as normal (2, 3, 4, 6).</div>' +
        ['z1', 'z2'].map((k, i) => { const b = (d.back || (d.back = { z1: { on: true, runs: 1, change: false }, z2: { on: true, runs: 1, change: false } }))[k]; return '<div class="sw"><span><b>Zone ' + (i + 1) + '</b></span><input type="checkbox" data-b="draft.back.' + k + '.on"' + (b.on ? ' checked' : '') + '></div>' + (b.on ? '<div class="grid2"><div><label>Runs</label><input type="number" min="0" max="6" data-n data-b="draft.back.' + k + '.runs" value="' + b.runs + '"></div><div class="sw" style="border:0"><span>Change strike</span><input type="checkbox" data-b="draft.back.' + k + '.change"' + (b.change ? ' checked' : '') + '></div></div>' : '<div class="mut">Switched off: taps on this zone are ignored</div>'); }).join('') + '</div>' +
        (d.tournamentId ? '<div class="tag k">Tournament match</div>' : '');
    } else if (d.step === 2) {
      const T = A.db.teams;
      if (T.length < 2) h += '<div class="card"><p>You need at least two teams.</p><button class="btn sm" data-a="demo">Add demo teams</button> <button class="btn sm ghost" data-a="go" data-v="teams">Create teams</button></div>';
      const sel = (k, other) => '<select data-b="draft.' + k + '" data-r><option value="">Select…</option>' + T.map(t => '<option value="' + t.id + '"' + (t.id === d[k] ? ' selected' : '') + (t.id === d[other] ? ' disabled' : '') + '>' + esc(t.name) + '</option>').join('') + '</select>';
      h += '<label>Team A</label>' + sel('a', 'b') + '<label>Team B</label>' + sel('b', 'a');
    } else if (d.step === 3) {
      [d.a, d.b].forEach(tid => {
        const t = A.db.teams.find(t => t.id === tid); if (!t) return;
        if (!d.xi[tid]) { d.xi[tid] = t.players.slice(0, d.ppt).map(p => p.id); d.sub[tid] = []; d.cap[tid] = d.xi[tid][0] || ''; d.wk[tid] = (t.players.find(p => p.role === 'Wicketkeeper' && d.xi[tid].includes(p.id)) || {}).id || ''; }

    }

<script>/* Scorecard, summary, live board, analytics, stats, history, tournaments */
(function () {
  'use strict';
  const A = window.A, CE = A.CE, esc = A.esc, ui = A.ui;

  const mOf = () => A.matchById(ui.params.id) || A.getMatch();

  A.copy = function (text) {

    try { navigator.clipboard.writeText(text).then(() => A.toast('Copied')); } catch (e) {
      const t = document.createElement('textarea'); t.value = text; document.body.appendChild(t); t.select(); try { document.execCommand('copy'); A.toast('Copied'); } catch (x) { } t.remove();
    }

  A.views.scorecard = function () {

    const i = Math.min(ui.sc != null ? ui.sc : m.innings.length - 1, m.innings.length - 1), inn = m.innings[i], st = CE.replay(m, inn), R = CE.rulesOf(m);

    h += '<div class="card k"><div class="row sp"><b>' + esc(m.teams[inn.batting].name) + '</b><span style="font-size:26px;font-weight:900">' + st.runs + '/' + st.wkts + ' <small>(' + st.oversText + ')</small></span></div><div class="mut">RR ' + A.fmt2(st.crr) + (inn.target ? ' · Target ' + inn.target : '') + '</div></div>';
    h += '<div class="card"><h3 style="margin-top:0">Batting</h3><table><tr><th>Batter</th><th>R</th><th>B</th><th>4s</th><th>6s</th><th>SR</th></tr>' +
      st.order.map(id => { const b = st.batters[id]; return '<tr><td><b>' + esc(pn(m, id)) + '</b><div class="mut">' + esc(CE.dismissalText(m, st, b)) + '</div></td><td><b>' + b.runs + '</b></td><td>' + b.balls + '</td><td>' + b.fours + '</td><td>' + b.sixes + '</td><td>' + (b.balls ? A.fmt1(b.runs / b.balls * 100) : '-') + '</td></tr>'; }).join('') + '</table>' +
      '<div class="mut" style="margin-top:6px">Yet to bat: ' + (st.availBatters.map(id => esc(pn(m, id))).join(', ') || '-') + '</div>' +
      '<div class="row sp" style="margin-top:8px"><span>Extras</span><b>' + st.extrasTotal + ' <span class="mut">(wd ' + st.extras.wd + ', nb ' + st.extras.nb + ', b ' + st.extras.b + ', lb ' + st.extras.lb + ')</span></b></div></div>';

  A.actions.scTab = el => { ui.sc = +el.dataset.v; A.render(); };

  /* ---------- summary ---------- */
  function summaryText(m) {
    const ev = CE.evaluate(m);
    return m.name + ' (' + m.date + ')\n' + m.innings.map(inn => { const s = CE.replay(m, inn); return m.teams[inn.batting].name + ': ' + s.runs + '/' + s.wkts + ' (' + s.oversText + ')'; }).join('\n') + '\n' + (ev.text || 'In progress') + '\nScored with CricTruf';
  }
  A.views.summary = function () {
    const m = mOf(); if (!m) return A.page('Summary', '<div class="empty">No match</div>');

  function pointsTable(t) {

    t.fixtures.filter(f => f.round === 'League' && f.matchId).forEach(f => {
      const m = A.matchById(f.matchId); if (!m || m.status !== 'completed') return;
      const ev = CE.evaluate(m); const A_ = rows[m.teams[0].id], B_ = rows[m.teams[1].id]; if (!A_ || !B_) return;
      A_.p++; B_.p++;
      if (ev.winner == null) { A_.t++; B_.t++; A_.pts++; B_.pts++; } else { const w = rows[m.teams[ev.winner].id], l = rows[m.teams[1 - ev.winner].id]; w.w++; w.pts += 2; l.l++; }

      h += '<h2>Leaderboard</h2><div class="grid2">' + kpi(esc(A.nameOf(bat.id)) + '<br>' + bat.runs, 'Top batsman') + kpi(esc(A.nameOf(bowl.id)) + '<br>' + bowl.wkts, 'Top bowler') + '</div><div class="card c" style="margin-top:8px"><span class="tag k">Player of the tournament</span><h3 style="margin:6px 0">' + esc(A.nameOf(pot.id)) + '</h3><div class="mut">Points: runs + 20 × wickets + 5 × sixes</div></div>';
    }
    const nx = nextStage(t); if (nx && A.canConfig()) h += '<button class="btn" data-a="genNext" data-id="' + t.id + '">' + esc(nx) + '</button>';
    return A.page(t.name, h, null);
  };
  function nextStage(t) {
    if (t.champion) return null;
    const last = t.fixtures[t.fixtures.length - 1]; if (!last) return null;
    const cur = t.fixtures.filter(f => f.round === last.round); if (!cur.every(f => fxWinner(f))) return null;
    if (t.format === 'league') { if (last.round === 'League') return t.teamIds.length >= 4 ? 'Create semi-finals' : 'Create final'; if (last.round === 'Semi-final') return 'Create final'; return 'Declare champion'; }
    return cur.length === 1 && last.round !== 'Round 0' ? 'Declare champion' : 'Create next round';
  }
  A.actions.genNext = el => {
    const t = A.db.tournaments.find(t => t.id === el.dataset.id), last = t.fixtures[t.fixtures.length - 1], cur = t.fixtures.filter(f => f.round === last.round);
    const w = cur.map(fxWinner);
    if (t.format === 'league') {
      if (last.round === 'League') { const pt = pointsTable(t).map(r => r.id); if (pt.length >= 4) { t.fixtures.push({ id: CE.uid(), a: pt[0], b: pt[3], round: 'Semi-final' }, { id: CE.uid(), a: pt[1], b: pt[2], round: 'Semi-final' }); } else t.fixtures.push({ id: CE.uid(), a: pt[0], b: pt[1], round: 'Final' }); }
      else if (last.round === 'Semi-final') t.fixtures.push({ id: CE.uid(), a: w[0], b: w[1], round: 'Final' });
      else t.champion = w[0];
    } else {
      if (cur.length === 1) t.champion = w[0]; else { const n = t.fixtures.filter(f => /^Round/.test(f.round)).map(f => f.round).filter((x, i, a) => a.indexOf(x) === i).length + 1; genKnock(t, w, w.length === 2 ? 'Final' : w.length === 4 ? 'Semi-final' : 'Round ' + n); }
    }
    A.save(); A.render();
  };
  A.actions.startFixture = el => {
    const t = A.db.tournaments.find(t => t.id === el.dataset.t), f = t.fixtures.find(f => f.id === el.dataset.f);
    if (!A.db.teams.find(x => x.id === f.a) || !A.db.teams.find(x => x.id === f.b)) return A.toast('A team was deleted');
    ui.draft = { step: 3, name: t.name + ': ' + tm(t, f.a) + ' vs ' + tm(t, f.b) + ' (' + f.round + ')', date: A.today(), venue: '', turf: '', overs: t.overs, ppt: Math.max(2, Math.min(8, A.db.teams.find(x => x.id === f.a).players.length, A.db.teams.find(x => x.id === f.b).players.length)), a: f.a, b: f.b, dicId: t.dicId, rules: CE.clone(A.db.rules), tournamentId: t.id, fixtureId: f.id, xi: {}, sub: {}, cap: {}, wk: {}, toss: {}, back: { z1: { on: true, runs: 1, change: false }, z2: { on: true, runs: 1, change: false } } };
    A.go('newmatch');
  };
})();
</script>
<script>/* Settings, rules editor, DIC zone editor, admin */
(function () {
  'use strict';
  const A = window.A, CE = A.CE, esc = A.esc, ui = A.ui;
  const getPath = p => { const s = p.split('.'); let o = { ui: A.ui, db: A.db, draft: A.ui.draft }[s[0]]; for (let i = 1; i < s.length; i++) o = o && o[s[i]]; return o; };

  /* ---------- rules form (used by settings + new match wizard) ---------- */
  A.rulesForm = function (path, R) {
    const num = (k, l) => '<div><label>' + l + '</label><input type="number" min="0" data-n data-b="' + path + '.' + k + '" value="' + R[k] + '"></div>';
    const sw = (k, l, sub) => '<div class="sw"><span>' + l + (sub ? '<div class="mut">' + sub + '</div>' : '') + '</span><input type="checkbox" data-b="' + path + '.' + k + '"' + (R[k] ? ' checked' : '') + '></div>';
    let h = '<div class="card"><h3 style="margin-top:0">Overs &amp; extras</h3><div class="grid2">' + num('ballsPerOver', 'Balls per over') + num('maxOversPerBowler', 'Max overs / bowler (0 = no limit)') + num('wideRuns', 'Wide penalty runs') + num('noBallRuns', 'No-ball penalty runs') + '</div>' +
      sw('wideReball', 'Wide is re-bowled', 'Off = a wide counts as a ball') + sw('noBallReball', 'No-ball is re-bowled') + sw('freeHit', 'Free hit after no-ball', 'Only run out allowed on a free hit') + sw('overEndSwap', 'Change strike at end of over') + sw('lastManBatting', 'Last-man batting', 'Innings continues until every batter is out') + '</div>';
    h += '<div class="card"><h3 style="margin-top:0">Dismissals allowed</h3>' + CE.DISMISSALS.map(d => '<div class="sw"><span>' + esc(d.label) + '</span><input type="checkbox" data-b="' + path + '.dismissals.' + d.k + '"' + (R.dismissals[d.k] !== false ? ' checked' : '') + '></div>').join('') + '</div>';
    h += '<div class="card"><h3 style="margin-top:0">Super over</h3>' + sw('superOver', 'Super over on a tie') + '<div class="grid2">' + num('superOverOvers', 'Super over overs') + num('superOverWickets', 'Wickets') + '</div></div>';
    h += '<div class="card"><h3 style="margin-top:0">DIC scoring</h3>' + sw('autoCommitZone', 'Auto-score on zone tap', 'Off = tap a zone, check it, then Confirm') + '</div>';
    h += '<div class="card"><h3 style="margin-top:0">Local rule shots</h3><div class="mut">Quick buttons on the scoring screen for roof, side-wall, net-touch and similar local rules.</div>' +
      (R.special || []).map((s, i) => '<div class="card" style="margin:8px 0"><input data-b="' + path + '.special.' + i + '.name" value="' + esc(s.name) + '" placeholder="Rule name"><div class="grid3"><div><label>Runs</label><input type="number" min="0" max="8" data-n data-b="' + path + '.special.' + i + '.runs" value="' + s.runs + '"></div><div><label>Strike</label><select data-b="' + path + '.special.' + i + '.rotate"><option value="keep"' + (s.rotate === 'keep' ? ' selected' : '') + '>Same</option><option value="change"' + (s.rotate === 'change' ? ' selected' : '') + '>Change</option></select></div><div><label>Out?</label><input type="checkbox" data-b="' + path + '.special.' + i + '.out"' + (s.out ? ' checked' : '') + '></div></div><button class="btn sm danger" data-a="delSpecial" data-p="' + path + '" data-i="' + i + '">Remove</button></div>').join('') +
      '<button class="btn sm" data-a="addSpecial" data-p="' + path + '">+ Add local rule</button></div>';
    h += '<div class="card"><label>Rule notes (boundary, roof, side wall, net touch…)</label><textarea rows="3" data-b="' + path + '.notes" placeholder="Anything the scorers should remember">' + esc(R.notes || '') + '</textarea></div>';
    return h;
  };
  A.actions.addSpecial = el => { const R = getPath(el.dataset.p); (R.special = R.special || []).push({ id: CE.uid(), name: 'New rule', runs: 1, rotate: 'keep', out: false }); if (/^db/.test(el.dataset.p)) A.save(); A.render(); };
  A.actions.delSpecial = el => { const R = getPath(el.dataset.p); R.special.splice(+el.dataset.i, 1); if (/^db/.test(el.dataset.p)) A.save(); A.render(); };

  A.views.rules = function () {
    const ro = !A.canConfig();
    return A.page('Default rules', (ro ? '<div class="card">Only an Admin can change rules.</div>' : '<p class="mut">These are the defaults for every new match. Each match stores its own copy, so changing them never affects past matches.</p>') + '<fieldset ' + (ro ? 'disabled' : '') + ' style="border:0;padding:0;margin:0">' + A.rulesForm('db.rules', A.db.rules) + '</fieldset>' +
      (ro ? '' : '<button class="btn ghost" data-a="resetRules">Reset rules to defaults</button>'), null, { keepScroll: true });
  };
  A.actions.resetRules = () => { A.db.rules = CE.clone(CE.DEFAULT_RULES); A.save(); A.render(); };

  /* ---------- DIC editor ---------- */
  function curDic() { return A.db.dics.find(d => d.id === ui.dicId) || A.db.dics[0]; }
  A.views.dic = function () {
    const d = curDic(), di = A.db.dics.indexOf(d), ro = !A.canConfig();
    const grp = ui.zsel ? zgrp(d) : [], z = grp[0] || null;
    const zname = ui.zsel === 'z1' ? 'Zone 1 (near ring)' : 'Zone 2 (grey area)';
    let h = '<p class="mut">Only <b>Zone 1</b> (the near ring around the pitch) and <b>Zone 2</b> (the grey area beside it) are DIC zones: you choose their runs and whether the strike changes. Everything else stays fixed: Middle 2, Outer 3 (strike changes), Boundary 4, over the net 6. Make one preset per turf or tournament.</p>' +
      '<label>Preset</label><select data-b="ui.dicId" data-r>' + A.db.dics.map(x => '<option value="' + x.id + '"' + (x.id === d.id ? ' selected' : '') + '>' + esc(x.name + (x.turf ? ' · ' + x.turf : '')) + '</option>').join('') + '</select>' +
      '<div class="grid2"><div><label>Preset name</label><input data-b="db.dics.' + di + '.name" value="' + esc(d.name) + '"' + (ro ? ' disabled' : '') + '></div><div><label>Turf / ground</label><input data-b="db.dics.' + di + '.turf" value="' + esc(d.turf || '') + '" placeholder="Turf name"' + (ro ? ' disabled' : '') + '></div></div>' +
      '<div class="card">' + '<div class="row sp"><span class="mut">Tap Zone 1 or Zone 2 to edit</span><button class="chip on" style="margin:0;flex:none" data-a="names">' + (ui.names ? 'Show runs' : 'Show shot names') + '</button></div>' + A.groundSVG(d.zones, { cfg: true, sel: ui.zsel, act: 'dzone', names: ui.names }) + '</div>';
    if (z) {
      h += '<div class="zinfo" style="position:static"><div class="z">' + zname + '</div>' +
        '<div class="sw" style="border:0"><span>Zone switched on</span><input type="checkbox" ' + (z.off ? '' : 'checked') + ' onchange="A.actions.dzoff(this.checked)"' + (ro ? ' disabled' : '') + '></div>' +
        '<div class="row"><button data-a="dzrun" data-d="-1"' + (ro ? ' disabled' : '') + '>−</button><div class="c b" style="font-size:24px">' + z.runs + ' run' + (z.runs === 1 ? '' : 's') + '</div><button data-a="dzrun" data-d="1"' + (ro ? ' disabled' : '') + '>+</button></div>' +
        '<div class="row" style="margin-top:8px"><button data-a="dzrot" data-v="keep" style="' + (z.rotate === 'keep' ? 'background:#000;color:var(--y)' : '') + '"' + (ro ? ' disabled' : '') + '>Same striker</button><button data-a="dzrot" data-v="change" style="' + (z.rotate === 'change' ? 'background:#000;color:var(--y)' : '') + '"' + (ro ? ' disabled' : '') + '>Change strike ↻</button></div></div>';
    }
    h += '<div class="card"><h3 style="margin-top:0">Shot names</h3><div class="mut">Left to right around the ground (right-hand batter). Shown with "Show shot names".</div><div class="grid2">' + CE.SHOTS.map((n, k) => '<div><label>' + (k + 1) + '</label><input value="' + esc((d.zones.find(x => x.ring === 1 && x.sec === k) || {}).label || n) + '" onchange="A.actions.shotName(' + k + ',this.value)"' + (ro ? ' disabled' : '') + '></div>').join('') + '</div></div>';
    if (!ro) h += '<div class="grid2" style="margin-top:10px"><button class="btn sm" data-a="dicNew">+ New preset</button><button class="btn sm ghost" data-a="dicDup">Duplicate</button><button class="btn sm ghost" data-a="dicReset">Reset zones</button><button class="btn sm danger" data-a="dicDel"' + (A.db.dics.length < 2 ? ' disabled' : '') + '>Delete</button></div>';
    return A.page('DIC zones', h, null, { keepScroll: true });
  };
  const zgrp = d => ui.zsel === 'z1' ? d.zones.filter(z => z.ring === 0 && z.id !== 'z2') : d.zones.filter(z => z.id === ui.zsel);
  A.actions.dzone = el => {
    const d = curDic(), z = d.zones.find(x => x.id === el.dataset.z); if (!z) return;
    if (z.id === 'z2') ui.zsel = 'z2'; else if (z.ring === 0) ui.zsel = 'z1';
    else { ui.zsel = null; A.toast('Fixed zone: ' + z.runs + ' run' + (z.runs === 1 ? '' : 's') + '. Only Zone 1 and Zone 2 can be changed'); }
    A.render();
  };
  A.actions.dzrun = el => { if (!A.canConfig()) return; zgrp(curDic()).forEach(z => z.runs = Math.max(0, Math.min(8, z.runs + (+el.dataset.d)))); A.save(); A.render(); };
  A.actions.dzrot = el => { if (!A.canConfig()) return; zgrp(curDic()).forEach(z => z.rotate = el.dataset.v); A.save(); A.render(); };
  A.actions.shotName = (k, v) => { if (!A.canConfig()) return; v = (v || '').trim(); if (!v) return A.render(); curDic().zones.filter(z => z.ring < 5 && z.sec === k).forEach(z => z.label = v); A.save(); A.toast('Saved'); A.render(); };
  A.actions.dzoff = on => { if (!A.canConfig()) return; zgrp(curDic()).forEach(z => z.off = !on); A.save(); A.render(); };
  A.actions.dicNew = () => { const d = CE.defaultDic('New turf'); A.db.dics.push(d); ui.dicId = d.id; ui.zsel = null; A.save(); A.render(); };
  A.actions.dicDup = () => { const d = CE.clone(curDic()); d.id = CE.uid(); d.name += ' copy'; A.db.dics.push(d); ui.dicId = d.id; A.save(); A.render(); };
  A.actions.dicReset = () => { if (!confirm('Reset this preset (Zone 1, Zone 2 and shot names) to the defaults?')) return; curDic().zones = CE.buildDefaultZones(); A.save(); A.render(); };
  A.actions.dicDel = () => { if (!confirm('Delete this preset? Past matches keep their own copy.')) return; A.db.dics = A.db.dics.filter(x => x.id !== curDic().id); ui.dicId = A.db.dics[0].id; ui.zsel = null; A.save(); A.render(); };

  /* ---------- settings / more ---------- */
  A.views.settings = function () {
    const u = A.db.user || {};
    const row = (a, v, t, s) => '<button class="card" style="width:100%;text-align:left" data-a="go" data-v="' + v + '"><b>' + t + '</b><div class="mut">' + s + '</div></button>';
    let h = '<div class="card row sp"><div><b>' + esc(u.name || '') + '</b><div class="mut">Role: ' + esc(u.role || '') + '</div></div><button class="btn sm ghost" data-a="logout" style="flex:none">Switch</button></div>' +
      '<div class="card"><div class="sw"><span><b>Dark mode</b></span><button class="chip on" style="margin:0" data-a="theme">' + (A.db.theme === 'dark' ? 'On: tap for light' : 'Off: tap for dark') + '</button></div>' +
      '<div class="sw"><span><b>4 / 6 celebration sound</b><div class="mut">The animated background always plays</div></span><input type="checkbox" data-b="db.sound"' + (A.db.sound ? ' checked' : '') + '></div></div>';
    h += row('go', 'dic', '◎ DIC zone presets', 'Runs and strike rotation per zone, per turf') + row('go', 'rules', '⚙ Default match rules', 'Wides, no-balls, free hit, local rule shots…') + row('go', 'tournaments', '🏆 Tournaments', 'Fixtures, points table, NRR, leaderboards') + row('go', 'admin', '🛡 Admin, backup & sync', 'Backup data, restore, offline sync') + row('go', 'about', 'ⓘ About', 'Version and how DIC scoring works');
    return A.page('More', h, 'more', { noBack: true });
  };
  A.actions.logout = () => { A.db.user = null; A.save(); ui.stack = []; ui.view = 'login'; A.render(); };

  A.views.about = function () {
    return A.page('About', '<div class="card"><b>CricTruf 1.0</b><p>CricTruf is built for tennis-ball, turf, box and gully cricket. Every delivery is saved on your phone the moment you score it, so it works with no internet.</p><h3>How DIC scoring works</h3><p>Open the <b>DIC Ground</b> tab while scoring and tap where the ball went. Zone 1 (back wall) and Zone 2 (behind square) give the runs you chose at the start of the match, by default 1 run with the same striker until the over completes. The front field is split into shot sectors (cover, cut, straight drive and so on) and only there can a 4 or a 6 be scored. The zone\'s runs and strike rule are applied. Confirm, or override the runs / strike for that one ball. The tapped zone is saved with the delivery and shown in Analytics.</p><h3>Undo &amp; correction</h3><p>Undo removes the last delivery. Correct lets you fix any of the last 12 balls. Every undo and correction is kept in the match audit history.</p></div>', null);
  };

  /* ---------- admin ---------- */
  A.views.admin = function () {
    const ro = !A.canConfig();
    const pend = A.db.matches.filter(m => (m.updated || m.created) > (A.db.lastSync || 0)).length;
    let h = '<div class="card"><h3 style="margin-top:0">Role on this device</h3><div>' + ['admin', 'scorer', 'viewer'].map(r => '<button class="chip ' + (A.db.user.role === r ? 'on' : '') + '" data-a="role" data-v="' + r + '">' + r + '</button>').join('') + '</div><div class="mut">Admin: rules, DIC, tournaments. Scorer: scoring. Viewer: read only.</div></div>';
    h += '<div class="card"><h3 style="margin-top:0">Offline sync</h3><div class="mut">All deliveries are stored on this device. ' + pend + ' match(es) changed since the last sync' + (A.db.lastSync ? ' (' + new Date(A.db.lastSync).toLocaleString() + ')' : '') + '. Each delivery has a unique id so a server can ignore duplicates.</div>' +
      '<label>Server URL (optional)</label><input data-b="db.serverUrl" value="' + esc(A.db.serverUrl || '') + '" placeholder="https://your-server.example.com"><button class="btn" data-a="syncNow">Sync now</button><div class="mut" style="margin-top:6px">No server is included in this build: leave blank to use on-device storage and the backup below.</div></div>';
    h += '<div class="card"><h3 style="margin-top:0">Backup &amp; restore</h3><button class="btn" data-a="backup">Copy / share full backup</button><label style="display:block;margin-top:10px">Paste a backup to restore</label><textarea rows="3" data-b="ui.restore" placeholder="Paste backup JSON here"></textarea><button class="btn ghost" data-a="restore"' + (ro ? ' disabled' : '') + '>Restore</button></div>';
    h += '<div class="card"><h3 style="margin-top:0">Audit history</h3>' + (function () { const a = []; A.db.matches.forEach(m => (m.audit || []).forEach(x => a.push({ m: m.name, x }))); a.sort((p, q) => q.x.ts - p.x.ts); return a.length ? a.slice(0, 15).map(r => '<div class="row sp"><span>' + esc(r.m) + ' · <b>' + r.x.action + '</b></span><span class="mut">' + new Date(r.x.ts).toLocaleTimeString() + '</span></div>').join('') : '<span class="mut">No undo/correction yet</span>'; })() + '</div>';
    if (!ro) h += '<button class="btn danger" data-a="wipe">Erase all data on this device</button>';
    return A.page('Admin', h, null, { keepScroll: true });
  };
  A.actions.role = el => { A.db.user.role = el.dataset.v; A.save(); A.render(); };
  A.actions.backup = () => A.copy(JSON.stringify(A.db));
  A.actions.restore = () => {
    try { const d = JSON.parse(ui.restore); if (!d.v || !d.matches) throw 0; if (!confirm('Replace all data on this device with this backup?')) return; d.user = A.db.user; A.db = d; A.save(); A.toast('Restored'); ui.restore = ''; A.render(); } catch (e) { A.toast('Not a valid backup'); }
  };
  A.actions.wipe = () => { if (!confirm('Erase everything on this device? This cannot be undone.')) return; localStorage.removeItem(A.KEY); location.reload(); };
  A.actions.syncNow = async () => {
    const url = (A.db.serverUrl || '').replace(/\/$/, ''); if (!url) return A.toast('Offline mode: no server set');
    if (!navigator.onLine) return A.toast('No internet connection');
    try {
      const r = await fetch(url + '/api/sync', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ user: A.db.user, matches: A.db.matches.filter(m => (m.updated || m.created) > (A.db.lastSync || 0)) }) });
      if (!r.ok) throw new Error(r.status); A.db.lastSync = Date.now(); A.save(); A.toast('Synced'); A.render();
    } catch (e) { A.toast('Sync failed: saved on device'); }
  };
  window.addEventListener('online', () => { if (A.db.serverUrl) A.actions.syncNow(); });
})();
</script>
<script>(function () {
  'use strict';
  const A = window.A;
  A.views.more = A.views.settings;
  if (A.db.user) A.ui.view = 'home';
  A.render();
  // Android back button hook (used by the native wrapper): returns true when handled
  window.__back = function () {
    const ui = A.ui;
    if (ui.modal && ui.view !== 'live') { ui.modal = null; A.render(); return true; }
    if (ui.stack.length) { A.back(); return true; }
    if (ui.view !== 'home' && ui.view !== 'login') { ui.view = 'home'; ui.modal = null; A.render(); return true; }
    return false;
  };
  // PWA service worker (only on http/https, not inside the Android WebView file:// origin)
  if ('serviceWorker' in navigator && /^https?:/.test(location.protocol)) navigator.serviceWorker.register('sw.js').catch(() => { });
})();
</script>
</body>
