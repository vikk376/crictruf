plugins {
    id 'com.android.application'
}

android {
    namespace 'com.crictruf.app'
    compileSdk 34

    defaultConfig {
        applicationId 'com.crictruf.app'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '1.0.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // The whole app lives in /www (shared with the PWA). It is bundled as Android assets.
    sourceSets {
        main {
            assets.srcDirs = ['../../www']
        }
    }
}
